name: LYO 30 minute Classroom staging acceptance
on:
  push:
    branches: [qa/lyo-classroom-30min-staging-20261113, qa/lyo-classroom-cleanup-fix-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thirty-minute-classroom:
    name: Authenticated Classroom hold and forced resume
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebSocket test dependency
        run: python -m pip install --disable-pip-version-check websockets==14.2
      - name: Verify same-scene rejoin and 30 minute heartbeat
        run: python -u scripts/qa/long_classroom_session.py
