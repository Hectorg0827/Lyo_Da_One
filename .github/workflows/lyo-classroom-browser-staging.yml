name: LYO Classroom browser staging acceptance
on:
  push:
    branches: [qa/lyo-classroom-browser-staging-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-classroom:
    name: Chromium login, Classroom scene and reconnect
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 websockets==14.2
          python -m playwright install --with-deps chromium
      - name: Exercise real staging Web UI with disposable QA learner
        run: python -u scripts/qa/browser_classroom_staging.py
      - name: Preserve only synthetic-user Classroom screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyo-classroom-browser-qa-screenshots
          path: artifacts/browser-classroom-staging/*.png
          if-no-files-found: ignore
          retention-days: 7
