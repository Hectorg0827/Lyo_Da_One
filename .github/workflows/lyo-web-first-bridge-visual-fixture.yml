name: LYO Web-first no-provider visual bridge handoff
# Real deployed Web UI + real staging login, simulated Classroom socket events.
# No Classroom AI model invocations, no production mutations or deployments.
on:
  push:
    branches: [release/lyo-web-first-20261120]
    paths:
      - 'scripts/qa/web_first_bridge_visual_fixture.py'
      - '.github/workflows/lyo-web-first-bridge-visual-fixture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-ui-bridge:
    name: Render quick teacher, handle reply and hand off to lesson
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      LYO_WEB_BASE_URL: https://lyoonestagingweb-staging.up.railway.app
      EXPECTED_WEB_SHA: 88b4c7b4b73d0e51120517de20bc7a996528228b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Web deployment exact commit
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import urlopen
          with urlopen(os.environ["LYO_WEB_BASE_URL"] + "/api/health", timeout=15) as r:
              j = json.loads(r.read())
          if j.get("status") != "healthy" or j.get("commit") != os.environ["EXPECTED_WEB_SHA"]:
              raise SystemExit("Web staging SHA mismatch")
          print("PASS: exact deployed Web candidate")
          PY
      - name: Install Chromium smoke dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 websockets==14.2
          python -m playwright install --with-deps chromium
      - name: Test actual visible Web using a safe synthetic Classroom socket
        run: python -u scripts/qa/web_first_bridge_visual_fixture.py
      - name: Retain only synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyo-web-bridge-visual-fixture
          path: artifacts/web-first-bridge-visual-fixture/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Record scope
        if: success()
        run: echo 'Real deployed Web UI passed bridge/scene rendering with simulated socket events; this does not prove real-AI grading or audible voice.' >> "$GITHUB_STEP_SUMMARY"
