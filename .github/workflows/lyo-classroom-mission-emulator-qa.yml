name: Classroom Mission Android Emulator QA (staging only)

# QA branch only. No deployment, production, releases or real learner writes.
on:
  push:
    branches: [qa/lyo-classroom-retention-phase1-20261115]
    paths:
      - 'android/app/src/main/java/com/lyo/app/ui/classroom/**'
      - 'android/app/src/main/java/com/lyo/app/ui/screens/classroom/**'
      - 'android/app/src/androidTest/java/com/lyo/app/ui/classroom/ClassroomMissionUiTest.kt'
      - '.github/workflows/lyo-classroom-mission-emulator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-mission-emulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classroom-mission-ui:
    name: Compose mission and handoff interaction checks (emulator, not phone signoff)
    if: github.ref == 'refs/heads/qa/lyo-classroom-retention-phase1-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LYO_STAGING_API_BASE_URL: https://lyojourneystagingbackend-staging.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Refuse non-staging endpoint
        run: |
          set -euo pipefail
          test "$LYO_STAGING_API_BASE_URL" = 'https://lyojourneystagingbackend-staging.up.railway.app'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise interactive missions on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: cd android && gradle :app:connectedDebugAndroidTest --no-daemon "-PLYO_STAGING_API_BASE_URL=$LYO_STAGING_API_BASE_URL" -Pandroid.testInstrumentationRunnerArguments.class=com.lyo.app.ui.classroom.ClassroomMissionUiTest
      - name: Upload sanitized emulator JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-mission-emulator-results
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
