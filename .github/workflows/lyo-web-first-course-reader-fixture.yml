name: LYO Web-first saved-course reader zero-provider acceptance
# Authenticates synthetic learner; intercepts only course-detail GET with a
# deterministic fixture. No live course generation or paid AI requests.
on:
  push:
    branches: [release/lyo-web-first-20261120]
    paths:
      - 'scripts/qa/web_first_course_reader_fixture.py'
      - '.github/workflows/lyo-web-first-course-reader-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course-reader:
    name: Deployed staging Web lesson reader / zero AI spend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LYO_WEB_BASE_URL: https://lyoonestagingweb-staging.up.railway.app
      EXPECTED_WEB_SHA: abbb91c58d50878fb6086e5ddab7de4e31891369
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and transport dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 websockets==14.2
          python -m playwright install --with-deps chromium
      - name: Verify real Web login and source-authored lessons via synthetic API fixture
        run: python -u scripts/qa/web_first_course_reader_fixture.py
      - name: Save only synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyo-course-reader-no-provider-ui
          path: artifacts/web-first-course-reader/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Evidence limit
        if: success()
        run: |
          echo 'Authenticated staging Web reader rendered saved lessons, rejected empty course, and scored indexed practice answer 1/1.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mocked course GET: does not prove live AI generation, real course persistence, grading or audible voice.' >> "$GITHUB_STEP_SUMMARY"
