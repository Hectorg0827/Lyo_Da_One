name: Staging Web Classroom Math and Layout

on:
  push:
    branches:
      - fix/staging-web-classroom-math-mode-layout-20261103
  pull_request:
    branches:
      - fix/web-mobile-classroom-live-parity-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Classroom behavior and real KaTeX rendering
        working-directory: web
        run: node --test src/lib/classroom-cast.test.mjs src/lib/web-mobile-classroom-parity.test.mjs src/lib/classroom-rich-math.test.mjs src/lib/classroom-audio.test.mjs
      - name: TypeScript compile
        working-directory: web
        run: npx tsc --noEmit
      - name: Production-mode web build
        working-directory: web
        run: npm run build
