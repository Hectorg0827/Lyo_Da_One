name: LYO post-fix staging persistence and 30-minute recovery 20261122
# Exact backend revision verified through Railway before workflow creation:
# ee52c48801d943074218c3b971fa1c46a1074c6f (LyoOne-Journey-Staging).
# Synthetic learners, zero real users, no production operations.
on:
  push:
    branches: [qa/lyo-web-live-gates-20261122]
    paths:
      - '.github/workflows/lyo-one-time-course-and-resume-20261122.yml'

permissions:
  contents: read
concurrency:
  group: lyo-post-fix-20261122-staging
  cancel-in-progress: false

jobs:
  real-course:
    name: Real DB course save, owner reload and cross-user isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned staging QA authentication dependency
        run: python -m pip install --disable-pip-version-check websockets==14.2
      - name: Require isolated backend health
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          url = 'https://lyojourneystagingbackend-staging.up.railway.app/health'
          with urlopen(url, timeout=15) as response:
              if response.status != 200:
                  raise SystemExit('Staging backend unhealthy')
          print('PASS staging health')
          PY
      - name: Commit, reopen and isolate actual intermediate algebra course
        run: python -u scripts/qa/web_first_real_course_persistence.py
      - name: Mark evidence boundary
        if: success()
        run: echo 'Real database persistence for authored algebra course passed; generative AI course authoring still requires separate acceptance.' >> "$GITHUB_STEP_SUMMARY"

  thirty-min-recovery:
    name: Real 30-minute Classroom saved scene resume and heartbeat
    needs: real-course
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned staging WebSocket transport
        run: python -m pip install --disable-pip-version-check websockets==14.2
      - name: Require same scene ID after forced reconnect and 30 minutes
        run: python -u scripts/qa/web_first_30m_classroom.py
      - name: Mark evidence boundary
        if: success()
        run: echo 'Real staging 30m socket recovery passed; mobile device audible playback remains separate.' >> "$GITHUB_STEP_SUMMARY"
