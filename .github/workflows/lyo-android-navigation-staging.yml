name: LYO Android navigation staging checks
# PR #211 staging verification; no production deployment
on:
  push:
    branches:
      - work/android-web-parity-20261111
  workflow_dispatch:
jobs:
  navigation-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Android primary navigation and Create
        run: node scripts/verify-android-product-navigation.mjs
      - name: Verify Android Community reliability contract
        run: node scripts/verify-android-community-reliability.mjs

  android:
    name: Android debug build and unit tests
    if: github.ref == 'refs/heads/work/android-web-parity-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Never let this staging CI artifact fall back to the production API.
      LYO_STAGING_API_BASE_URL: ${{ vars.LYO_STAGING_API_BASE_URL || 'https://android-ci.invalid/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK and run all debug unit tests
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug testDebugUnitTest --no-daemon 2>&1 | tee android-build.log
      - name: Upload build log and unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-staging-test-results
          path: |
            android/android-build.log
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: discover-device-validation-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
