name: LYO isolated staging real course readback diagnostic 20261122
# Single zero-provider bounded synthetic course check; staging only.
on:
  push:
    branches: [qa/lyo-web-live-gates-20261122]
    paths: ['.github/workflows/lyo-one-time-course-readback-diagnostic.yml']
permissions:
  contents: read
jobs:
  durable-course:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check websockets==14.2
      - name: Verify database course readback, owner isolation, clean QA accounts
        run: python -u scripts/qa/web_first_real_course_persistence.py
