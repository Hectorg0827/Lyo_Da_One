name: LYO Web-first deployed staging acceptance
# Deployed staging candidate only; uses a disposable learner with verified cleanup.
# No production operations, merge, or Android/iOS build.
on:
  # Paid live AI testing is manual-only; no push trigger.
  workflow_dispatch:
    inputs:
      expected_staging_sha:
        description: 'Exact 40-character Web commit currently deployed to isolated staging'
        required: true
        type: string
      staging_ai_spend_approved:
        description: 'I authorize bounded staging AI usage for this live test'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deployed-chromium:
    if: ${{ inputs.staging_ai_spend_approved == true }}
    name: Pinned deployed staging Web visible login/course/Classroom/second profile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LYO_WEB_BASE_URL: https://lyoonestagingweb-staging.up.railway.app
      EXPECTED_STAGING_SHA: ${{ inputs.expected_staging_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact expected staging deployment before learner requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen
          url = os.environ["LYO_WEB_BASE_URL"] + "/api/health"
          import re
          expected = os.environ["EXPECTED_STAGING_SHA"].strip()
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("FAIL: explicit 40-character staging commit SHA required")
          for attempt in range(60):
              try:
                  with urlopen(url, timeout=10) as response:
                      data = json.loads(response.read())
                  if data.get("status") != "healthy":
                      raise ValueError("health status not healthy")
                  commit = str(data.get("commit") or "").strip()
                  if commit == expected:
                      print("PASS: staging Web serves exact pinned SHA", flush=True)
                      break
                  if attempt % 10 == 0:
                      print("Waiting for exact staging SHA (reported: "
                            + ("missing" if not commit else "different") + ")", flush=True)
              except Exception:
                  if attempt % 10 == 0:
                      print("Waiting for staging health", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("FAIL: staging did not report expected Web SHA")
          PY
      - name: Install browser and staging test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 websockets==14.2
          python -m playwright install --with-deps chromium
      - name: Verify deployed Web real learner journey and isolated cleanup
        run: python -u scripts/qa/web_first_browser_classroom.py
      - name: Retain synthetic-only screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-first-deployed-staging-acceptance
          path: artifacts/web-first-browser-qa/*.png
          if-no-files-found: ignore
          retention-days: 3
