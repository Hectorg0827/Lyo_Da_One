name: LYO authenticated Web Classroom and Chat axe smoke
# Existing deployed staging Web only; no real text AI / TTS or learner data.
on:
  push:
    branches: [qa/web-auth-classroom-a11y-20261122]
    paths:
      - 'scripts/qa/web_first_authenticated_classroom_a11y.py'
      - '.github/workflows/lyo-web-auth-classroom-a11y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-in-classroom-a11y:
    name: Staging authenticated Chat/Classroom axe and viewport QA
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_WEB_SHA: '9247f2d6e75329e9c9eba9d5fbf8762917449921'
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile test, install isolated axe and pinned Chromium
        run: |
          python -m py_compile scripts/qa/web_first_authenticated_classroom_a11y.py
          npm install --prefix /tmp/lyo-axe --no-audit --no-fund --no-save axe-core@4.10.3
          python -m pip install --disable-pip-version-check playwright==1.56.0 websockets==14.2
          python -m playwright install --with-deps chromium
      - name: Run Web authenticated accessibility smoke without AI/TTS
        run: python -u scripts/qa/web_first_authenticated_classroom_a11y.py
      - name: Explicit scope limit
        if: always()
        run: |
          echo 'Two authenticated Web routes x three viewport widths, real staging UI with local synthetic Classroom WebSocket.' >> "$GITHUB_STEP_SUMMARY"
          echo 'All model and TTS browser requests refused, user synthetic account cleanup asserted; no paid AI requests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not full Web accessibility, physical screen-reader, real AI teacher, or spoken microphone acceptance.' >> "$GITHUB_STEP_SUMMARY"
