name: LYO Continuous Teaching isolated preview acceptance

on:
  push:
    branches: [qa/lyo-continuous-preview-acceptance-20261118]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyo-continuous-preview-acceptance
  cancel-in-progress: false

jobs:
  preview-auth-classroom:
    name: Synthetic preview Classroom, bridge and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check websockets==14.2
      - name: Scope QA to existing dedicated preview, never regular staging or production
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa/live_classroom_auth.py')
          s = p.read_text()
          old = 'https://lyojourneystagingbackend-staging.up.railway.app'
          new = 'https://lyo-continuousteaching-preview-backend-staging.up.railway.app'
          assert s.count(old) == 1
          s = s.replace(old, new)
          s = s.replace('    if resume:\n        params["resume"]', '    params["continuous_teaching"] = "1"\n    if resume:\n        params["resume"]')
          s = s.replace(
              '        async def wait():\n            async for raw in ws:',
              '        async def wait():\n            seen_bridge = False\n            async for raw in ws:')
          marker = '                if kind == "ERROR":'
          bridge_check = (
              '                if kind == "BRIDGE_MESSAGE" and not resume:\n'
              '                    if nested.get("ungraded") is not True:\n'
              '                        raise RuntimeError("Bridge reply was graded")\n'
              '                    if not seen_bridge:\n'
              '                        seen_bridge = True\n'
              '                        print("PASS: bridge before scene, ms=" +\n'
              '                              str(round((time.monotonic()-start)*1000)), flush=True)\n'
              '                        if nested.get("prompt") is True and isinstance(nested.get("generation"), int):\n'
              '                            await ws.send(json.dumps({"event_type": "bridge_reply",\n'
              '                                "session_id": session_id, "generation": nested["generation"],\n'
              '                                "text": "I think fractions can help us share equally."}))\n'
          )
          assert s.count(marker) == 1
          s = s.replace(marker, bridge_check + marker)
          scene_marker = '                if isinstance(scene, dict) and scene.get("scene_id"):'
          assert s.count(scene_marker) == 1
          s = s.replace(scene_marker, scene_marker +
              '\n                    if not resume and not seen_bridge:\n'
              '                        raise RuntimeError("No ungraded bridge preceded first scene")')
          return_marker = '        return scene_id, round((time.monotonic() - start) * 1000)'
          assert s.count(return_marker) == 1
          transition_check = (
              '        if resume:\n'
              '            transition_start = time.monotonic()\n'
              '            await ws.send(json.dumps({"event_type": "user_action",\n'
              '                "action_intent": "continue", "session_id": session_id,\n'
              '                "component_id": "qa_preview_continue"}))\n'
              '            while time.monotonic() - transition_start < 8:\n'
              '                remaining = 8 - (time.monotonic() - transition_start)\n'
              '                raw = await asyncio.wait_for(ws.recv(), timeout=max(0.1, remaining))\n'
              '                message = json.loads(raw)\n'
              '                data = message.get("data") or {}\n'
              '                if (str(data.get("event_type") or message.get("event_type") or "").lower()\n'
              '                        == "bridge_message" and data.get("phase") == "transition"):\n'
              '                    if data.get("ungraded") is not True:\n'
              '                        raise RuntimeError("Transition reply was graded")\n'
              '                    print("PASS: ungraded transition bridge, ms=" +\n'
              '                          str(round((time.monotonic()-transition_start)*1000)), flush=True)\n'
              '                    break\n'
              '            else:\n'
              '                raise RuntimeError("No transition bridge within eight seconds")\n'
          )
          s = s.replace(return_marker, transition_check + return_marker)
          p.write_text(s)
          compile(s, str(p), 'exec')
          print('PASS: ephemeral QA runner targets dedicated preview backend only')
          PY
      - name: Real authenticated synthetic learner, Classroom and saved-scene recovery
        run: python -u scripts/qa/live_classroom_auth.py

  preview-web-chromium:
    name: Preview Web Chromium auth and scene recovery
    needs: preview-auth-classroom
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0 websockets==14.2
      - name: Scope Web and API to the already-deployed preview pair
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path('scripts/qa/live_classroom_auth.py')
          web = Path('scripts/qa/browser_classroom_staging.py')
          a = api.read_text()
          b = web.read_text()
          assert a.count('https://lyojourneystagingbackend-staging.up.railway.app') == 1
          assert b.count('https://lyoonestagingweb-staging.up.railway.app') == 1
          api.write_text(a.replace('https://lyojourneystagingbackend-staging.up.railway.app',
                  'https://lyo-continuousteaching-preview-backend-staging.up.railway.app'))
          b = b.replace('https://lyoonestagingweb-staging.up.railway.app',
                  'https://lyo-continuousteaching-preview-web-staging.up.railway.app')
          ui_anchor = '            await page.get_by_role("button", name="Leave classroom").wait_for(timeout=25000)'
          assert b.count(ui_anchor) == 1
          ui_probe = (
              '            bridge = page.get_by_role("region", name="Live teacher conversation before the next lesson step")\n'
              '            await bridge.wait_for(timeout=12000)\n'
              '            print("PASS: real preview Web rendered instant teacher conversation", flush=True)\n'
              '            await page.get_by_label("Your ungraded reply to the teacher").fill("Sharing equally")\n'
              '            await page.get_by_role("button", name="Reply", exact=True).click()\n'
              '            print("PASS: learner submitted ungraded Web bridge reply", flush=True)\n'
          )
          b = b.replace(ui_anchor, ui_probe + ui_anchor)
          assert b.count('                  this.__qaSceneIds = [];') == 1
          b = b.replace('                  this.__qaSceneIds = [];',
              '                  this.__qaSceneIds = [];\n                  this.__qaBridgeFlags = [];')
          scene_hook = '                    if (scene?.scene_id) this.__qaSceneIds.push(String(scene.scene_id));'
          assert b.count(scene_hook) == 1
          b = b.replace(scene_hook, scene_hook +
              '\n                    if (event.event_type === "bridge_message" && event.data?.generation) this.__qaBridgeFlags.push(event.data?.ai_generated === true);')
          confirm = '            print("PASS: learner submitted ungraded Web bridge reply", flush=True)'
          assert b.count(confirm) == 1
          follow_up = (
              '\n            await page.wait_for_function('
              '"() => (window.__lyoQaSockets || []).some(s => (s.__qaBridgeFlags || []).length >= 2)", '
              'timeout=9000)\n'
              '            ai_reply = await page.evaluate('
              '"() => (window.__lyoQaSockets || []).some(s => (s.__qaBridgeFlags || [])[1] === true)")\n'
              '            print("PASS: follow-up reply received; Gemini_generated=" + str(ai_reply), flush=True)'
          )
          b = b.replace(confirm, confirm + follow_up)
          web.write_text(b)
          compile(b, str(web), 'exec')
          print('PASS: Chromium target pinned to dedicated previews')
          PY
      - run: python -u scripts/qa/browser_classroom_staging.py
      - name: Retain sanitized staging QA screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-teaching-preview-synthetic-screenshots
          path: artifacts/browser-classroom-staging/*.png
          if-no-files-found: ignore
          retention-days: 7
