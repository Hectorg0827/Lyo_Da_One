name: LYO Magical Live — staging Android test APK

on:
  pull_request:
    branches: [main, feat/lyo-live-magical-ui-20261031]

permissions:
  contents: read

jobs:
  staging-apk:
    if: (github.head_ref == 'feat/lyo-live-magical-ui-20261031' || github.head_ref == 'codex/classroom-blackboard-premium-ui-20261102') && github.event.pull_request.head.repo.full_name == github.repository
    name: Build locked staging Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LYO_STAGING_API_BASE_URL: https://lyojourneystagingbackend-staging.up.railway.app/
      LYO_GPT_LIVE_TRIAL_UI: 'false'
      LYO_VERSION_CODE: '20261102'
      LYO_VERSION_NAME: '2026.11.02-premium-classroom-preview'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build staging-targeted debug APK and Android unit tests
        working-directory: android
        run: gradle assembleDebug testDebugUnitTest --no-daemon
      - name: Verify preview version and label
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\\n' "$BADGING" | grep "^package: name='com.lyo.app' versionCode='20261102' versionName='2026.11.02-premium-classroom-preview'"
          printf '%s\\n' "$BADGING" | grep "^application-label:'LYO Premium Preview'"
          cp "$APK" android/app/build/outputs/apk/debug/LYO-PREMIUM-CLASSROOM-20261102.apk
      - name: Upload identifiable staging APK for Samsung validation
        uses: actions/upload-artifact@v4
        with:
          name: LYO-PREMIUM-CLASSROOM-20261102
          path: android/app/build/outputs/apk/debug/LYO-PREMIUM-CLASSROOM-20261102.apk
          if-no-files-found: error
          retention-days: 7
